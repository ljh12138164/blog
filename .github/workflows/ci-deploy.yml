name: CI and Deploy

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:early-hints
      - run: pnpm test:indexnow-submit
      - run: pnpm test:theme
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:resource-hints
      - name: Verify static artifacts
        shell: bash
        run: |
          test -f out/index.html
          test -f out/_pagefind/pagefind.js
          test -f out/sitemap.xml
          test -f out/robots.txt
          test -f .next/early-hints-map.conf
          cmp public/1da648d59c024d869f2523943dce4c6b.txt out/1da648d59c024d869f2523943dce4c6b.txt
      - name: Build and verify runtime image
        shell: bash
        run: |
          image="blog:verify-${GITHUB_SHA}"
          container="blog-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          temporary=$(mktemp -d)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true; rm -rf "$temporary"' EXIT

          docker build --tag "$image" .
          docker run --detach --name "$container" --publish 127.0.0.1:18081:8080 "$image"

          ready=0
          for _ in {1..15}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:18081/healthz; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

          curl --fail --silent --show-error \
            --dump-header "$temporary/root.headers" \
            --output /dev/null \
            "http://127.0.0.1:18081/?verify=1"
          grep -Eiq '^link: .*rel=preload; as=style' "$temporary/root.headers"

          curl --fail --silent --show-error \
            --dump-header "$temporary/article.headers" \
            --output /dev/null \
            "http://127.0.0.1:18081/posts/cloudflare-http3-early-hints?verify=1"
          grep -Eiq '^link: .*rel=preload; as=style' "$temporary/article.headers"

          stylesheet=$(sed -nE 's/^Link: <([^>]+\.css)>;.*/\1/ip' "$temporary/root.headers" | head -n 1)
          test -n "$stylesheet"
          curl --fail --silent --show-error \
            --dump-header "$temporary/asset.headers" \
            --output /dev/null \
            "http://127.0.0.1:18081${stylesheet}"
          ! grep -Eiq '^link:' "$temporary/asset.headers"

          curl --fail --silent --show-error \
            --dump-header "$temporary/health.headers" \
            --output /dev/null \
            http://127.0.0.1:18081/healthz
          ! grep -Eiq '^link:' "$temporary/health.headers"

  deploy:
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.verify.result == 'success'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: blog-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: target
        name: Resolve immutable release tag
        shell: bash
        run: |
          echo "value=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Configure restricted SSH client
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Build immutable local image
        env:
          RELEASE_TAG: ${{ steps.target.outputs.value }}
        run: |
          docker build \
            --tag "blog:$RELEASE_TAG" \
            .
      - name: Deploy Docker image bundle
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'blog-deploy' }}
          RELEASE_TAG: ${{ steps.target.outputs.value }}
        shell: bash
        run: |
          test -n "$DEPLOY_HOST"
          release_dir=$(mktemp -d)
          trap 'rm -rf "$release_dir"' EXIT
          mkdir -p "$release_dir/deploy/server"
          docker save "blog:$RELEASE_TAG" -o "$release_dir/image.tar"
          cp compose.yaml "$release_dir/compose.yaml"
          cp deploy/host-nginx.conf "$release_dir/deploy/host-nginx.conf"
          cp deploy/server/deploy-blog "$release_dir/deploy/server/deploy-blog"
          cp deploy/server/blog-deploy-gate "$release_dir/deploy/server/blog-deploy-gate"
          cp deploy/server/blog-deploy.sudoers "$release_dir/deploy/server/blog-deploy.sudoers"
          tar -C "$release_dir" -czf - \
            image.tar compose.yaml deploy/host-nginx.conf \
            deploy/server/deploy-blog deploy/server/blog-deploy-gate deploy/server/blog-deploy.sudoers | ssh -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $RELEASE_TAG"
      - name: Verify public deployment
        shell: bash
        run: |
          page=$(mktemp)
          headers=$(mktemp)
          final_headers=$(mktemp)
          indexnow_key=$(mktemp)
          trap 'rm -f "$page" "$headers" "$final_headers" "$indexnow_key"' EXIT
          curl --fail --silent --show-error \
            --header "Cache-Control: no-cache" \
            --dump-header "$headers" \
            --output "$page" \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://blog.ljhboard.cn/"
          awk '
            /^HTTP\// { block = $0 ORS; next }
            { block = block $0 ORS }
            END { printf "%s", block }
          ' "$headers" > "$final_headers"
          test "$(grep -o '<link rel="canonical"' "$page" | wc -l)" -eq 1
          grep -Fq '<link rel="canonical" href="https://blog.ljhboard.cn"' "$page"
          ! grep -Eq 'https?://([0-9]{1,3}\.){3}[0-9]{1,3}' "$page"
          grep -Eq '^HTTP/[^ ]+ 200' "$final_headers"
          grep -Eiq '^link: .*rel=preload; as=style' "$final_headers"
          curl --fail --silent --show-error --location \
            --header "Cache-Control: no-cache" \
            --output /dev/null \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://blog.ljhboard.cn/posts/react-query-api-optimization"
          curl --fail --silent --show-error --location \
            --header "Cache-Control: no-cache" \
            --output "$indexnow_key" \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://blog.ljhboard.cn/1da648d59c024d869f2523943dce4c6b.txt"
          cmp public/1da648d59c024d869f2523943dce4c6b.txt "$indexnow_key"
      - name: Submit deployed URLs to IndexNow
        run: node scripts/submit-indexnow-urls.mjs
