name: CI and Deploy

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: blog-ci
          POSTGRES_DB: blog_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U blog -d blog_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgres://blog:blog-ci@127.0.0.1:5432/blog_test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @blog/web exec vitest run scripts/google-consent.test.mjs
      - run: pnpm test:resource-hints
      - run: pnpm --filter @blog/web exec vitest run scripts/personal-hub.test.mjs
      - name: Verify static artifacts
        shell: bash
        run: |
          test -f apps/blog/out/index.html
          test -f apps/blog/out/_pagefind/pagefind.js
          test -f apps/blog/out/sitemap.xml
          test -f apps/blog/out/robots.txt
          cmp apps/blog/public/profile/contributions-light.svg apps/blog/out/profile/contributions-light.svg
          cmp apps/blog/public/profile/contributions-dark.svg apps/blog/out/profile/contributions-dark.svg
          test -f apps/blog/.next/early-hints-map.conf
          cmp apps/blog/public/1da648d59c024d869f2523943dce4c6b.txt apps/blog/out/1da648d59c024d869f2523943dce4c6b.txt
      - name: Build API runtime image
        run: docker build -f apps/api/Dockerfile -t blog-api:verify .
      - name: Verify API runtime image
        shell: bash
        env:
          DATABASE_URL: postgres://blog:blog-ci@127.0.0.1:5432/blog_test
        run: |
          password_hash=$(bun -e 'console.log(await Bun.password.hash(crypto.randomUUID()))')
          session_secret=$(bun -e 'console.log(crypto.randomUUID() + crypto.randomUUID())')
          docker run --rm --network host -e DATABASE_URL -e JOURNAL_PASSWORD_HASH="$password_hash" blog-api:verify bun dist/database/migrate.js
          docker run -d --name journal-api-verify --network host \
            -e DATABASE_URL \
            -e SESSION_SECRET="$session_secret" -e COOKIE_SECURE=true blog-api:verify
          trap 'docker logs journal-api-verify; docker rm -f journal-api-verify' EXIT
          for _ in {1..20}; do
            if curl -fsS http://127.0.0.1:3001/api/readyz; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Build and verify runtime image
        shell: bash
        run: |
          image="blog:verify-${GITHUB_SHA}"
          container="blog-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          temporary=$(mktemp -d)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true; rm -rf "$temporary"' EXIT

          docker build --tag "$image" .
          docker run --detach --name "$container" --publish 127.0.0.1:18081:8080 "$image"

          ready=0
          for _ in {1..15}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:18081/healthz; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Container failed to become healthy. Container logs:"
            docker logs "$container" || true
            exit 1
          fi

          curl --fail --silent --show-error \
            --dump-header "$temporary/root.headers" \
            --output /dev/null \
            "http://127.0.0.1:18081/?verify=1"
          grep -Eiq '^link: .*rel=preload; as=style' "$temporary/root.headers"

          curl --fail --silent --show-error \
            --dump-header "$temporary/article.headers" \
            --output /dev/null \
            "http://127.0.0.1:18081/posts/cloudflare-http3-early-hints?verify=1"
          grep -Eiq '^link: .*rel=preload; as=style' "$temporary/article.headers"

          curl --silent --show-error \
            --dump-header "$temporary/redirect.headers" \
            --output /dev/null \
            "http://127.0.0.1:18081/%E5%B7%A5%E7%A8%8B%E5%8C%96%E7%A0%94%E7%A9%B6/%E5%8D%95%E4%BB%93%E5%BA%93%E7%AE%A1%E7%90%86?test=1"
          grep -Eiq '^HTTP/[^ ]+ 301' "$temporary/redirect.headers"
          grep -Eiq '^location: /posts/monorepo-management\?test=1' "$temporary/redirect.headers"

          stylesheet=$(sed -nE 's/^Link: <([^>]+\.css)>;.*/\1/ip' "$temporary/root.headers" | head -n 1)
          test -n "$stylesheet"
          curl --fail --silent --show-error \
            --dump-header "$temporary/asset.headers" \
            --output /dev/null \
            "http://127.0.0.1:18081${stylesheet}"
          ! grep -Eiq '^link:' "$temporary/asset.headers"

          curl --fail --silent --show-error \
            --dump-header "$temporary/health.headers" \
            --output /dev/null \
            http://127.0.0.1:18081/healthz
          ! grep -Eiq '^link:' "$temporary/health.headers"

  deploy:
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.verify.result == 'success'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: blog-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: target
        name: Resolve immutable release tag
        shell: bash
        run: |
          echo "value=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Configure restricted SSH client
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Build immutable local image
        env:
          RELEASE_TAG: ${{ steps.target.outputs.value }}
        run: |
          docker build \
            --tag "blog:$RELEASE_TAG" \
            .
      - name: Deploy Docker image bundle
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'blog-deploy' }}
          RELEASE_TAG: ${{ steps.target.outputs.value }}
        shell: bash
        run: |
          test -n "$DEPLOY_HOST"
          release_dir=$(mktemp -d)
          trap 'rm -rf "$release_dir"' EXIT
          mkdir -p "$release_dir/deploy/server"
          docker save "blog:$RELEASE_TAG" -o "$release_dir/image.tar"
          cp compose.yaml "$release_dir/compose.yaml"
          cp deploy/host-nginx.conf "$release_dir/deploy/host-nginx.conf"
          cp deploy/server/deploy-blog "$release_dir/deploy/server/deploy-blog"
          cp deploy/server/blog-deploy-gate "$release_dir/deploy/server/blog-deploy-gate"
          cp deploy/server/blog-deploy.sudoers "$release_dir/deploy/server/blog-deploy.sudoers"
          tar -C "$release_dir" -czf - \
            image.tar compose.yaml deploy/host-nginx.conf \
            deploy/server/deploy-blog deploy/server/blog-deploy-gate deploy/server/blog-deploy.sudoers | ssh -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $RELEASE_TAG"
      - name: Verify public deployment
        shell: bash
        run: |
          page=$(mktemp)
          headers=$(mktemp)
          final_headers=$(mktemp)
          indexnow_key=$(mktemp)
          trap 'rm -f "$page" "$headers" "$final_headers" "$indexnow_key"' EXIT
          curl --fail --silent --show-error \
            --header "Cache-Control: no-cache" \
            --dump-header "$headers" \
            --output "$page" \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://ljhboard.cn/"
          awk '
            /^HTTP\// { block = $0 ORS; next }
            { block = block $0 ORS }
            END { printf "%s", block }
          ' "$headers" > "$final_headers"
          test "$(grep -o '<link rel="canonical"' "$page" | wc -l)" -eq 1
          grep -Fq '<link rel="canonical" href="https://ljhboard.cn"' "$page"
          ! grep -Eq 'https?://([0-9]{1,3}\.){3}[0-9]{1,3}' "$page"
          grep -Eq '^HTTP/[^ ]+ 200' "$final_headers"
          grep -Eiq '^link: .*rel=preload; as=style' "$final_headers"
          curl --fail --silent --show-error --location \
            --header "Cache-Control: no-cache" \
            --output /dev/null \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://ljhboard.cn/posts/react-query-api-optimization"
          curl --fail --silent --show-error --location \
            --header "Cache-Control: no-cache" \
            --output "$indexnow_key" \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://ljhboard.cn/1da648d59c024d869f2523943dce4c6b.txt"
          cmp apps/blog/public/1da648d59c024d869f2523943dce4c6b.txt "$indexnow_key"
      - name: Submit deployed URLs to IndexNow
        working-directory: apps/blog
        run: node scripts/submit-indexnow-urls.mjs
