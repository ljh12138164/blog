name: CI and Deploy

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing immutable image tag to redeploy, for example sha-0123..."
        required: false
        type: string

permissions:
  contents: read

env:
  SITE_URL: ${{ vars.SITE_URL || 'http://60.205.171.159' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
      - name: Verify static artifacts
        shell: bash
        run: |
          test -f out/index.html
          test -f out/_pagefind/pagefind.js
          test -f out/sitemap.xml
          test -f out/robots.txt

  deploy:
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.verify.result == 'success'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: blog-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
      - id: target
        name: Resolve immutable release tag
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          tag="${REQUESTED_TAG:-sha-${GITHUB_SHA}}"
          if [[ ! "$tag" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "Invalid image tag: $tag" >&2
            exit 2
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"
      - name: Configure restricted SSH client
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy verified static release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '60.205.171.159' }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'blog-deploy' }}
          RELEASE_TAG: ${{ steps.target.outputs.value }}
        shell: bash
        run: |
          tar -C out -czf - . | ssh -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $RELEASE_TAG"
