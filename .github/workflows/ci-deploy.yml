name: CI and Deploy

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: Verify static artifacts
        shell: bash
        run: |
          test -f out/index.html
          test -f out/_pagefind/pagefind.js
          test -f out/sitemap.xml
          test -f out/robots.txt

  deploy:
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.verify.result == 'success'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: blog-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: target
        name: Resolve immutable release tag
        shell: bash
        run: |
          echo "value=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Configure restricted SSH client
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Build immutable local image
        env:
          RELEASE_TAG: ${{ steps.target.outputs.value }}
        run: |
          docker build \
            --tag "blog:$RELEASE_TAG" \
            .
      - name: Deploy Docker image bundle
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '60.205.171.159' }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'blog-deploy' }}
          RELEASE_TAG: ${{ steps.target.outputs.value }}
        shell: bash
        run: |
          release_dir=$(mktemp -d)
          trap 'rm -rf "$release_dir"' EXIT
          mkdir -p "$release_dir/deploy/server"
          docker save "blog:$RELEASE_TAG" -o "$release_dir/image.tar"
          cp compose.yaml "$release_dir/compose.yaml"
          cp deploy/host-nginx.conf "$release_dir/deploy/host-nginx.conf"
          cp deploy/server/deploy-blog "$release_dir/deploy/server/deploy-blog"
          cp deploy/server/blog-deploy-gate "$release_dir/deploy/server/blog-deploy-gate"
          cp deploy/server/blog-deploy.sudoers "$release_dir/deploy/server/blog-deploy.sudoers"
          tar -C "$release_dir" -czf - \
            image.tar compose.yaml deploy/host-nginx.conf \
            deploy/server/deploy-blog deploy/server/blog-deploy-gate deploy/server/blog-deploy.sudoers | ssh -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $RELEASE_TAG"
      - name: Verify public deployment
        shell: bash
        run: |
          page=$(mktemp)
          trap 'rm -f "$page"' EXIT
          curl --fail --silent --show-error \
            --output "$page" \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://blog.ljhboard.cn/?deploy=${GITHUB_SHA}"
          test "$(grep -o '<link rel="canonical"' "$page" | wc -l)" -eq 1
          grep -Fq '<link rel="canonical" href="https://blog.ljhboard.cn"' "$page"
          ! grep -Eq '<(link|meta)[^>]+https?://([0-9]{1,3}\.){3}[0-9]{1,3}' "$page"
