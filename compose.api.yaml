name: blog-storage
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server env file}
      POSTGRES_DB: blog
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    image: blog-api:${IMAGE_TAG:-latest}
    pull_policy: never
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with host postgres}
      JOURNAL_PASSWORD_HASH: ${JOURNAL_PASSWORD_HASH:?Set JOURNAL_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      COOKIE_SECURE: "true"
    ports:
      - "127.0.0.1:18081:3001"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
