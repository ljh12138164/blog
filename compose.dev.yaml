name: blog-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog-local
      POSTGRES_DB: blog
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_dev:
