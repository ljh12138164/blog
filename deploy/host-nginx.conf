server {
    listen 80;
    listen [::]:80;
    server_name ai.ljhboard.cn;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ai.ljhboard.cn;

    ssl_certificate /www/server/panel/vhost/cert/ai.ljhboard.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/ai.ljhboard.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:18080/healthz;
    }

    location /stats/ {
        proxy_pass https://analytics.ljhboard.cn/;
        proxy_ssl_server_name on;
        proxy_ssl_name analytics.ljhboard.cn;
        proxy_set_header Host analytics.ljhboard.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_cache off;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
